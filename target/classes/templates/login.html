<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{base :: base_fragment(~{::title}, ~{::#content}, ~{})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <body>
    <div id="content">
      <div class="grid grid-cols-12 mt-4">
        <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>
        <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">
          <div
            class="block p-6 border-t-[10px] border-blue-700 bg-white rounded-xl shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:hover:bg-gray-700"
          >
            <!-- message popup -->
            <div data-th-replace="message :: popup_message"></div>

            <h5
              class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white"
            >
              Login Here
            </h5>
            <p class="font-normal text-gray-400 dark:text-gray-400 mb-6">
              Start managing contacts on cloud ...
            </p>

            <div class="text-red-600 text-center" th:if="${param.error}">
              Invalid username and password.
            </div>
            <div class="text-green-600 text-center" th:if="${param.logout}">
              You have been logged out.
            </div>

            <form th:action="@{/authentication}" method="post" class="mt-5">
              <!-- email field -->
              <div class="mb-3">
                <label
                  for="email"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  placeholder="name@flowbite.com"
                  required
                />
                <!-- <p
                  class="text-red-700"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                ></p> -->
              </div>

              <!-- password field -->
              <div class="mb-3">
                <label
                  for="password"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >New Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  required
                />
                <!-- <p
                  class="text-red-700"
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
                ></p> -->
              </div>

              <!-- button -->
              <div class="mb-3 flex justify-center space-x-3">
                <button
                  type="submit"
                  class="px-3 py-2 rounded bg-gray-800 hover:bg-gray text-white dark:bg-blue-800 dark:hover:bg-blue-800"
                >
                  Login
                </button>
                <button
                  type="reset"
                  class="px-3 py-2 rounded bg-red-800 hover:bg-orange text-white dark:bg-red-800 dark:hover:bg-red-800"
                >
                  Reset
                </button>
              </div>
            </form>

            <div class="social-buttons-container flex justify-center mt-5">
              <a
                data-th-href="@{'/oauth2/authorization/google'}"
                style="
                  background-color: #ffffff !important; /* White background */
                  color: #424242 !important; /* Dark gray text */
                  padding: 10px 20px !important;
                  border-radius: 8px !important; /* Slightly more rounded corners */
                  font-size: 16px !important;
                  font-weight: 500 !important; /* Medium font weight */
                  text-decoration: none !important; /* Remove underline for links */
                  display: inline-flex !important; /* Allows padding and alignment */
                  align-items: center !important;
                  justify-content: center !important;
                  gap: 8px !important; /* Space between icon and text */
                  border: 1px solid #dadce0 !important; /* Subtle border */
                  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1) !important; /* Softer shadow */
                  transition: all 0.2s ease-in-out !important; /* Smooth transitions for all properties */
                  cursor: pointer !important;
                "
                onmouseover="this.style.backgroundColor='#f0f0f0'; this.style.boxShadow='0 3px 6px rgba(0,0,0,0.15)'"
                onmouseout="this.style.backgroundColor='#ffffff'; this.style.boxShadow='0 2px 3px rgba(0,0,0,0.1)'"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M17.64 9.2045C17.64 8.56364 17.5818 7.95455 17.4727 7.36364H9V10.6364H14.2182C13.9727 11.9545 13.2273 12.9955 12.1818 13.6864V15.9364H14.9909C16.6455 14.3636 17.64 12.1227 17.64 9.2045Z"
                    fill="#4285F4"
                  />
                  <path
                    d="M9 18C11.4318 18 13.4636 17.1955 14.9909 15.9364L12.1818 13.6864C11.4091 14.1955 10.3273 14.5227 9 14.5227C6.54545 14.5227 4.49545 12.8818 3.75455 10.6364H0.863636V12.8864C2.37273 15.8909 5.40455 18 9 18Z"
                    fill="#34A853"
                  />
                  <path
                    d="M3.75455 10.6364C3.59091 10.2273 3.5 9.77273 3.5 9.29545C3.5 8.81818 3.59091 8.36364 3.75455 7.95455V5.70455H0.863636C0.309091 6.81818 0 8.00455 0 9.29545C0 10.5864 0.309091 11.7727 0.863636 12.8864L3.75455 10.6364Z"
                    fill="#FBBC05"
                  />
                  <path
                    d="M9 3.47727C10.3273 3.47727 11.5136 3.97727 12.4318 4.84091L15.0818 2.19091C13.4636 0.804545 11.4318 0 9 0C5.40455 0 2.37273 2.10909 0.863636 5.11364L3.75455 7.36364C4.49545 5.11818 6.54545 3.47727 9 3.47727Z"
                    fill="#EA4335"
                  />
                </svg>
                Login with Google
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
