<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="base_fragment(title, content, end)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-th-replace="${title}"></title>

    <!-- Flowbite css -->
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.0.0/dist/flowbite.min.css"
      rel="stylesheet"
    />

    <!-- Font awesome css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom css -->
    <link rel="stylesheet" data-th-href="@{'/css/output.css'}" />
    <link rel="stylesheet" data-th-href="@{'/css/style.css'}" />
  </head>

  <body class="dark:bg-gray-900 dark:text-white">
    <div th:if="${loggedInUser!=null and isUserPage==true}">
      <div data-th-replace="~{user/sidebar::sidebar}"></div>
    </div>

    <div
      th:classappend="${loggedInUser!=null and isUserPage==true} ? 'md:ml-64' : ''"
    >
      <div th:if="${loggedInUser != null}">
        <div data-th-replace="~{user/user_navbar::user-navbar}"></div>
      </div>

      <div th:unless="${loggedInUser != null}">
        <div data-th-replace="~{navbar :: navbar}"></div>
      </div>

      <div class="p-4">
        <section data-th-replace="${content}"></section>
      </div>
    </div>

    <div data-th-replace="${end}"></div>
  </body>

  <script src="/js/Theme.js"></script>
  <script src="/js/UserSidebar.js"></script>
</html>
