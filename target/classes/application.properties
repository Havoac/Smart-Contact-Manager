spring.application.name=scm2.0
spring.config.import=optional:classpath:secret.properties


# mysql configuration
spring.datasource.url = jdbc:mysql://localhost:3306/scm2
spring.datasource.username=root
spring.datasource.password=${db-password}

#jpa configuration
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.web=DEBUG

#oauth2 configuration
spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
# spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/{registrationId}

#cloudinary configuration
cloudinary.cloud.name=${cloudinary.cloud-name}
cloudinary.api.key=${cloudinary.api-key}
cloudinary.api.secret=${cloudinary.api-secret}
